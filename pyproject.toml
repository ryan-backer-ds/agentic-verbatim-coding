[project]
name = "verbatim"
version = "0.1.0"
description = "Agentic analysis of open-ended survey responses with Pydantic AI, LangChain, LangGraph and Google ADK on GCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pydantic-ai-slim[google,groq]>=2.73",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.scripts]
verbatim = "verbatim.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verbatim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, pep8-naming, pathlib, ruff-specific
select = ["E", "F", "I", "B", "UP", "SIM", "N", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test folders mirror src/verbatim/ and need no __init__.py files.
addopts = ["--import-mode=importlib"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
