[project]
name = "verbatim"
version = "1.0.0"
description = "Agentic analysis of open-ended survey responses with Pydantic AI, LangChain, LangGraph and Google ADK on GCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a,mcp]>=2.15",
    "google-genai>=2.34",
    "langchain-core>=1.8.4",
    "langgraph>=1.2.24",
    "mcp>=2.3",
    "numpy>=2.0",
    "opentelemetry-sdk>=1.39",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pydantic-ai-slim[google,groq]>=2.73",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
verbatim = "verbatim.cli:main"

[project.optional-dependencies]
gcp = [
    "google-adk[gcp,otel-gcp]>=2.15",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verbatim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, pep8-naming, pathlib, ruff-specific
select = ["E", "F", "I", "B", "UP", "SIM", "N", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test folders mirror src/verbatim/ and need no __init__.py files.
addopts = ["--import-mode=importlib"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["opentelemetry.exporter.cloud_trace"]

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true
