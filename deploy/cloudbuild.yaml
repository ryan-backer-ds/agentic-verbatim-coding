# Build the image, push it to Artifact Registry, and roll the batch job onto it.
# Infrastructure (registry, job, accounts) comes from infra/ (Terraform).
#
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --service-account=projects/PROJECT_ID/serviceAccounts/verbatim-deployer@PROJECT_ID.iam.gserviceaccount.com .

substitutions:
  _REGION: europe-west2
  _JOB: verbatim-batch
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/verbatim/verbatim

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY # required when the build runs as a chosen service account

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${BUILD_ID}", "-t", "${_IMAGE}:latest", "."]

  - id: smoke-test
    name: gcr.io/cloud-builders/docker
    args: ["run", "--rm", "${_IMAGE}:${BUILD_ID}", "--version"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  # Every execution of the job now runs this exact, immutable image.
  - id: roll-out
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_JOB}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
