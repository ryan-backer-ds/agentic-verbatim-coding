# Lint and test every push and pull request. Tests are offline: no API keys needed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --all-extras: the gcp extra (Model Armor, Cloud Trace) is type-checked and tested too.
      - run: uv sync --locked --all-extras # fails if uv.lock is out of date
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  # The image Cloud Run runs: check that it builds and that the command starts.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t verbatim .
      - run: docker run --rm verbatim --version
