# Deploy to Google Cloud on a version tag (or by hand), with no stored keys:
# GitHub's OIDC token becomes short-lived credentials of the deployer account
# through Workload Identity Federation (infra/github.tf).
#
# Repository variables (from `terraform output`): GCP_PROJECT_ID,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SERVICE_ACCOUNT.
name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # add required reviewers in GitHub to gate releases
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-west2
      DEPLOYER: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build the image and roll out the batch job
        run: >
          gcloud builds submit . --config deploy/cloudbuild.yaml
          --service-account "projects/$PROJECT_ID/serviceAccounts/$DEPLOYER"
          --substitutions "_REGION=$REGION"

      - uses: astral-sh/setup-uv@v7

      - name: Deploy the ADK agent to Agent Runtime
        run: |
          uv sync --locked --extra gcp
          uv build --wheel
          mkdir -p data
          gcloud storage cp --recursive "gs://$PROJECT_ID-verbatim-data/processed" "gs://$PROJECT_ID-verbatim-data/index" data/
          uv run python deploy/deploy_agent.py --project "$PROJECT_ID" --region "$REGION"
